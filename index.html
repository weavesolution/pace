<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b365d">
<title>PACE Mobile</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--navy:#1b365d;--org:#d67a3a;--org2:#a84e12;--bg:#f4f2ee;--card:#fff;--line:#e4dfd7;--mut:#6b645c;--txt:#1c1917;--ok:#15803d;--bad:#b91c1c;--warn:#a16207}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.4 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--navy);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 14px 10px;border-bottom:3px solid var(--org);display:flex;align-items:center;gap:10px}
header .b{background:var(--org);font-weight:800;letter-spacing:2px;font-size:12px;padding:3px 8px}
header .t{flex:1;min-width:0}
header .s{font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .d{font-size:11px;color:#c9d6e8}
header #inst{background:var(--org);border-color:var(--org);font-weight:700;padding:4px 9px;font-size:12px}
header button{background:none;border:1px solid rgba(255,255,255,.35);color:#fff;border-radius:6px;padding:6px 10px;font-size:13px}
main{padding:12px 12px calc(76px + env(safe-area-inset-bottom))}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav a{flex:1;text-align:center;padding:8px 2px 7px;font-size:11px;color:var(--mut);text-decoration:none}
nav a i{display:block;font-style:normal;font-size:19px;line-height:1.2}
nav a.on{color:var(--org2);font-weight:700;box-shadow:inset 0 3px 0 var(--org)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.7px;color:var(--navy);margin:16px 2px 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:10px}
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;border-top:3px solid var(--org)}
.kpi .l{font-size:11px;color:var(--mut);text-transform:uppercase;letter-spacing:.4px}
.kpi .v{font-size:19px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .x{font-size:11px;color:var(--mut)}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 0;border-bottom:1px solid #f0ece6}
.row:last-child{border-bottom:none}
.row .n{font-weight:600}.row .m{font-size:12px;color:var(--mut)}
.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.red{color:var(--bad)}.green{color:var(--ok)}.amber{color:var(--warn)}
.big{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
input,select{width:100%;font:inherit;padding:10px 12px;border:1px solid #cfc7bb;border-radius:8px;background:#fff;color:var(--txt)}
input:focus,select:focus{outline:2px solid var(--org);border-color:var(--org)}
.btn{display:block;width:100%;padding:12px;border:none;border-radius:8px;background:var(--navy);color:#fff;font:inherit;font-weight:700;margin-top:10px}
.btn.o{background:var(--org)}.btn.l{background:#fff;color:var(--navy);border:1px solid var(--navy)}
.chips{display:flex;gap:6px;margin:8px 0;overflow-x:auto}
.chip{border:1px solid #cfc7bb;background:#fff;border-radius:16px;padding:5px 12px;font-size:12px;white-space:nowrap}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.bars{display:flex;align-items:flex-end;gap:4px;height:90px;margin-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:9px;color:var(--mut);height:100%}
.bars b{display:block;width:100%;background:var(--org);border-radius:3px 3px 0 0;min-height:1px}
.empty{color:var(--mut);text-align:center;padding:24px 8px}
.tag{display:inline-block;font-size:10px;padding:1px 6px;border-radius:8px;background:#f1ece4;color:var(--mut);margin-left:4px}
table{width:100%;border-collapse:collapse;font-size:12.5px}
td,th{padding:6px 4px;border-bottom:1px solid #f0ece6;text-align:left}th{font-size:11px;color:var(--mut);font-weight:600}
.sticky{position:sticky;top:62px;z-index:2;background:var(--bg);padding:4px 0 6px}
.err{background:#fef2f2;color:#991b1b;border:1px solid #fecaca;border-radius:8px;padding:10px;margin-bottom:10px}
.foot{text-align:center;font-size:11px;color:var(--mut);margin-top:18px}
a.act{color:var(--org2);font-weight:600;text-decoration:none;margin-right:14px}
#upd{position:sticky;top:58px;z-index:4;background:#fff7ed;border-bottom:1px solid #fed7aa;color:#9a3412;padding:8px 12px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px}
#upd button{background:var(--org);color:#fff;border:none;border-radius:6px;padding:7px 12px;font-weight:700}
.wv img{height:30px;margin-bottom:6px;transition:filter .15s}.wv:active img,.wv:hover img{filter:brightness(.78)}
</style>
</head>
<body>
<header><span class="b">PACE</span><button id="inst" style="display:none">&#11015; Install</button><div class="t"><div class="s" id="hs">PACE Mobile</div><div class="d" id="hd"></div></div><button id="rf">Refresh</button></header>
<main id="m"></main>
<nav id="nav">
  <a href="#home" data-r="home"><i>&#9750;</i>Home</a>
  <a href="#day" data-r="day"><i>&#128197;</i>Day</a>
  <a href="#cust" data-r="cust"><i>&#128100;</i>Customers</a>
  <a href="#stock" data-r="stock"><i>&#128230;</i>Stock</a>
  <a href="#more" data-r="more"><i>&#8942;</i>More</a>
</nav>
<script src="app.js"></script>
</body>
</html>
